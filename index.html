
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13x13 五子棋 - 人机对战</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-container {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        canvas {
            background-color: #eecfa1; /* 木纹色背景 */
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .btn {
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: bold;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1 class="text-3xl font-bold text-gray-800 mb-2"><i class="fas fa-chess-board text-indigo-600 mr-2"></i>五子棋 (13x13)</h1>
        <p class="text-gray-500 mb-4">人机对战模式 - 你执黑棋先行</p>
        
        <div id="statusDisplay" class="status-badge bg-green-100 text-green-800">
            游戏进行中
        </div>

        <canvas id="chessBoard" width="520" height="520"></canvas>

        <div class="mt-6 flex justify-center gap-4">
            <button onclick="game.restart()" class="btn bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-opacity-50">
                <i class="fas fa-redo mr-2"></i>重新开始
            </button>
            <button onclick="game.undo()" class="btn bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50">
                <i class="fas fa-undo mr-2"></i>悔棋
            </button>
        </div>
        
        <div class="mt-4 text-sm text-gray-400">
            <p>提示：点击棋盘交叉点落子，率先连成五子者获胜。</p>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
